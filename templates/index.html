<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Marks Calculator</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 520px;
        margin: 40px auto;
        padding: 0 16px;
        color: #222;
      }
      h1 {
        margin-bottom: 20px;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      input,
      button {
        padding: 10px;
        font-size: 16px;
        border: 1px solid #aaa;
        border-radius: 6px;
      }
      button {
        background: #1f6feb;
        color: white;
        border: none;
        cursor: pointer;
      }
      button:hover {
        background: #1658bd;
      }
      .result {
        margin-top: 24px;
        padding: 12px 16px;
        background: #eef6ee;
        border-left: 4px solid #2e8b57;
      }
    </style>
  </head>
  <body>
    <h1>Marks Calculator</h1>

    <!-- The form: each name="" must match request.form["..."] in app.py -->
    <form method="POST">
      <input type="text" name="name" placeholder="Enter your name" required />
      <input type="number" name="midterm" placeholder="Midterm mark" required />
      <input type="number" name="final" placeholder="Final mark" required />
      <button type="submit">Calculate</button>
    </form>

    <!-- Only shown after the form is submitted (when result is not None) -->
    {% if result is not none %}
    <div class="result">
      <h2>Hello, {{ name }}</h2>
      <p>Your total mark is {{ result }}</p>
    </div>
    {% endif %}
  </body>
</html>
