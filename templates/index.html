<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Marks Calculator</title>
    <!-- link to the stylesheet -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <div class="card">
      <h1>Marks Calculator</h1>

      <!-- The form: each name="" must match request.form["..."] in app.py -->
      <form method="POST">
        <input type="text" name="name" placeholder="Enter your name" required />
        <input
          type="number"
          name="midterm"
          placeholder="Midterm mark"
          min="0"
          required
        />
        <input
          type="number"
          name="final"
          placeholder="Final mark"
          min="0"
          required
        />
        <button type="submit">Calculate</button>
      </form>
    </div>

    <!-- Only shown after the form is submitted (when result is not None) -->
    {% if result is not none %}
    <div class="result">
      <h2>Hello, {{ name }}</h2>
      <p>Your total mark is {{ result }}</p>
    </div>
    {% endif %}
  </body>
</html>
